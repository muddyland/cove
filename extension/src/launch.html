<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Open in Cove</title>
  <link rel="stylesheet" href="launch.css" />
</head>
<body>
  <header class="bar">
    <img src="../icons/icon-48.png" alt="" width="18" height="18" />
    <h1>Open in Cove</h1>
    <a id="settings-link" href="options.html" target="_blank" title="Extension options">⚙</a>
  </header>

  <main id="form" hidden>
    <label class="field">
      <span class="label">Link</span>
      <input id="url" type="url" spellcheck="false" />
    </label>

    <label class="field">
      <span class="label">Browser</span>
      <select id="image"></select>
    </label>

    <fieldset class="field">
      <legend class="label">Network</legend>
      <div class="segmented" id="network"></div>
      <p class="hint" id="network-hint"></p>
    </fieldset>

    <label class="toggle primary">
      <input id="ephemeral" type="checkbox" checked />
      <span>
        <strong>Ephemeral</strong>
        <em>Nothing is saved — the workspace and its profile are discarded when it stops.</em>
      </span>
    </label>

    <label class="toggle sub" id="autoremove-row">
      <input id="autoRemove" type="checkbox" checked />
      <span>
        <strong>Discard when stopped</strong>
        <em>Remove it from the Cove grid when it halts, like <code>docker run --rm</code>.</em>
      </span>
    </label>

    <details id="advanced">
      <summary>Advanced options<span id="advanced-note" class="summary-note"></span></summary>
      <div class="adv">
        <label class="toggle"><input id="kiosk" type="checkbox" /><span><strong>Kiosk mode</strong><em>Full screen, locked: no tab bar, context menu or shortcuts.</em></span></label>
        <label class="toggle sub"><input id="kioskMenu" type="checkbox" /><span><strong>…but keep the tab bar</strong><em>Full screen without the lockdown.</em></span></label>
        <label class="toggle"><input id="dark" type="checkbox" /><span><strong>Dark mode</strong><em id="dark-hint">Force dark rendering on pages that have no dark theme.</em></span></label>
        <p id="browser-note" class="adv-note" hidden></p>
        <label class="toggle"><input id="lanAccess" type="checkbox" /><span><strong>LAN access</strong><em>Reach your local network. Only works if an admin has enabled it.</em></span></label>
        <label class="toggle"><input id="customDns" type="checkbox" /><span><strong>Custom DNS</strong><em>Resolve through specific public servers.</em></span></label>
        <label class="field sub" id="dns-field" hidden>
          <span class="label">DNS servers</span>
          <input id="dnsServers" type="text" placeholder="1.1.1.1 9.9.9.9" spellcheck="false" />
        </label>
        <label class="field sub" id="exit-field" hidden>
          <span class="label">Tailscale exit node</span>
          <input id="tsExitNode" type="text" placeholder="optional — a node name or IP" spellcheck="false" />
        </label>
        <label class="toggle"><input id="gpuAccel" type="checkbox" /><span><strong>GPU acceleration</strong><em>Hardware video encode. Needs an admin toggle and a GPU.</em></span></label>
        <label class="toggle"><input id="allowSudo" type="checkbox" /><span><strong>Allow sudo</strong><em>Drops no-new-privileges inside the container.</em></span></label>
        <label class="toggle"><input id="clearBrowserLock" type="checkbox" /><span><strong>Clear browser lock</strong><em>Remove a stale single-instance lock before starting.</em></span></label>
        <label class="toggle"><input id="wayland" type="checkbox" checked /><span><strong>Wayland</strong><em>Off forces the X11 fallback.</em></span></label>
        <label class="field">
          <span class="label">Workspace name</span>
          <input id="name" type="text" placeholder="auto" spellcheck="false" />
        </label>
        <label class="toggle"><input id="remember" type="checkbox" /><span><strong>Remember these as my defaults</strong><em>Applies to the next link you open.</em></span></label>
      </div>
    </details>

    <button id="launch" class="go">Launch</button>
    <p class="status" id="status" role="status"></p>
  </main>

  <div id="loading" class="centered">Connecting to Cove…</div>

  <div id="blocked" class="centered" hidden>
    <p id="blocked-msg"></p>
    <button id="blocked-action" class="go"></button>
  </div>

  <script type="module" src="launch.js"></script>
</body>
</html>

# This file runs unchanged on both the internal GitLab and the public mirror.
#
# Nothing here names an internal host or service. Where packages come from is
# decided entirely by group variables the tools read themselves --
# PIP_INDEX_URL and NPM_CONFIG_REGISTRY -- so internally they resolve through
# the caching registry and on the mirror they resolve from PyPI and npmjs,
# with no difference in this file.
#
# The one extra job internally is a dependency audit, pulled in only when
# CI_TEMPLATES is set. On the mirror that variable does not exist, the
# include is skipped, and the pipeline is exactly what you see below.
include:
  - project: $CI_TEMPLATES
    ref: main
    file: /audit.yml
    rules:
      - if: $CI_TEMPLATES

stages:
  - lint
  - test
  - build

variables:
  # Plain images by default; override per project to use a mirror.
  PYTHON_IMAGE: python:3.14-slim
  # This project is still on node 20.
  NODE_IMAGE: node:20-alpine
  DOCKER_IMAGE: docker:29.8.2
  # Prefix for the Dockerfile's FROM lines. Empty means Docker Hub.
  BASE_REGISTRY: ""
  # Set USE_DHI to "true" to build the image on a Docker Hardened Image (no
  # shell, no package manager) instead of python:3.14-slim. Off by default, so
  # the public mirror builds on slim. DHI_PYTHON_IMAGE is the repository
  # without a tag: the build installs into its "-dev" variant and ships the
  # plain one. The default is Docker's own DHI registry, which needs a login;
  # internally, set DHI_PYTHON_IMAGE as a CI/CD variable to the registry mirror
  # instead (kept out of this file, which is mirrored public). debian13, not
  # alpine: Pillow, bcrypt and sqlcipher3 are glibc wheels, the same as slim.
  # docker-compose.dhi.yml does the same switch for a local build.
  USE_DHI: "false"
  DHI_PYTHON_IMAGE: "dhi.io/python"
  DHI_PYTHON_TAG: "3.14-debian13"

# ── Shared bases ──────────────────────────────────────────────────────────

.python_base:
  image: $PYTHON_IMAGE
  tags: [saas-linux-small-amd64]
  before_script:
    - pip install --quiet -r backend/requirements.txt

.node_base:
  image: $NODE_IMAGE
  tags: [saas-linux-small-amd64]
  before_script:
    - cd frontend && npm ci

# ── Lint ──────────────────────────────────────────────────────────────────

lint:backend:
  extends: .python_base
  stage: lint
  before_script:
    - pip install --quiet ruff
  script:
    - cd backend && ruff check server

lint:frontend:
  extends: .node_base
  stage: lint
  script:
    # No dedicated lint script; vue-tsc is the type-level lint.
    - npx vue-tsc --noEmit

# ── Test ──────────────────────────────────────────────────────────────────

test:backend:
  extends: .python_base
  stage: test
  before_script:
    - pip install --quiet -r backend/requirements.txt pytest pytest-asyncio
  script:
    - cd backend
    # Import smoke test — fails fast on broken imports / wiring.
    - python -c "import server.main; print('app import OK')"
    - pytest -q --tb=short

test:frontend:
  extends: .node_base
  stage: test
  script:
    - npm test

build:frontend:
  extends: .node_base
  stage: test
  script:
    - npm run build
  artifacts:
    paths: [frontend/dist]
    expire_in: 14 days

# ── Build ─────────────────────────────────────────────────────────────────

build:image:
  stage: build
  tags: [saas-linux-small-amd64]
  image: $DOCKER_IMAGE
  services:
    # Explicit alias: GitLab derives a service's hostname from its image name,
    # so a registry prefix on DOCKER_IMAGE would otherwise move it away from
    # "docker" and `docker info` would wait forever for a host that never
    # comes up.
    - name: $DOCKER_IMAGE-dind
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - until docker info; do sleep 1; done
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    # Push a single image manifest. Docker 29 builds into the containerd image
    # store and attaches a provenance attestation by default, which turns the
    # push into an OCI index; the GitLab registry rejects that with "blob
    # unknown to registry". Without attestations the push is one manifest.
    # USE_DHI swaps the builder and runtime Python images together: the
    # dependency stage builds against its image's libc, so the pair must match.
    - |
      PY_ARGS=""
      # Pass whichever package indexes the job has through to the build: the
      # tools read them natively in a job container, but `docker build` does
      # not inherit the job's environment. Unset, the Dockerfile's public
      # defaults apply, which is the case on the mirror.
      if [ -n "${PIP_INDEX_URL:-}" ]; then
        PY_ARGS="$PY_ARGS --build-arg PIP_INDEX_URL=$PIP_INDEX_URL"
      fi
      if [ -n "${NPM_CONFIG_REGISTRY:-}" ]; then
        PY_ARGS="$PY_ARGS --build-arg NPM_CONFIG_REGISTRY=$NPM_CONFIG_REGISTRY"
      fi
      if [ "$USE_DHI" = "true" ]; then
        echo "USE_DHI=true: runtime image on ${DHI_PYTHON_IMAGE}:${DHI_PYTHON_TAG}"
        PY_ARGS="$PY_ARGS --build-arg PYTHON_BUILDER_IMAGE=${DHI_PYTHON_IMAGE}:${DHI_PYTHON_TAG}-dev"
        PY_ARGS="$PY_ARGS --build-arg PYTHON_RUNTIME_IMAGE=${DHI_PYTHON_IMAGE}:${DHI_PYTHON_TAG}"
      fi
      docker build --provenance=false --sbom=false --build-arg BASE_REGISTRY="$BASE_REGISTRY" $PY_ARGS \
        --tag $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_NAME
  rules:
    - if: '$CI_COMMIT_REF_NAME == "main"'
    - if: '$CI_COMMIT_TAG'
    - exists: [Dockerfile]
